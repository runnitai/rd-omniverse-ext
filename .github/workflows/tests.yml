# The same suite the internal pipeline runs, on the same Python. It needs no
# Kit, no GPU and no network: tests/conftest.py stubs omni.* so the extension
# imports and runs headless.
#
# Pillow is installed deliberately. Four tests cover the PNG crop and encode
# paths and skip silently without it, which looks like a green run that checked
# more than it did.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pillow

      - name: Run the suite
        run: python -m pytest tests -q
